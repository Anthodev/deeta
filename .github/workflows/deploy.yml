name: Deploy to remote server

on:
  # Deploy when docker-build workflow completes successfully
  workflow_run:
    workflows: ["Docker Build and Publish"]
    types:
      - completed
    branches: []
    tags: ['*']
  # Manual trigger
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to remote server
    runs-on: ubuntu-latest
    environment: prod
    # Only run if manually triggered or if the docker-build workflow was successful after a tag push
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_SERVER_SSH_HOST }}
          username: ${{ secrets.REMOTE_SERVER_SSH_USERNAME }}
          key: ${{ secrets.REMOTE_SERVER_SSH_KEY }}
          port: ${{ secrets.REMOTE_SERVER_SSH_PORT }}
          script: |
            # Navigate to your project directory
            cd ~/projects/deeta

            # Create data directories if they don't exist
            mkdir -p ./data/database
            mkdir -p ./data/uploads

            # Create or update docker-compose.yml for production
            cat > docker-compose.yml <<EOF
            services:
              php:
                image: anthodev/deeta:latest
                container_name: deeta-app
                restart: unless-stopped
                environment:
                  APP_ENV: prod
                  APP_SECRET: ${{APP_SECRET}}
                  DATABASE_URL: ${{DATABASE_URL}}
                  SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
                  MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
                  MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}/.well-known/mercure}
                  MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
                  MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
                  MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
                  MESSENGER_TRANSPORT_DSN=${MESSENGER_TRANSPORT_DSN}
                volumes:
                  - caddy_data:/data
                  - caddy_config:/config
                  # Mount database directory
                  - ./data/database:/var/www/html/var/database
                  # Mount uploads directory
                  - ./data/uploads:/var/www/html/public/uploads
                ports:
                  - "80:80"
                  - "443:443"
                  
            volumes:
              caddy_data:
              caddy_config:
            EOF

            # Create .env file if it doesn't exist
            if [ ! -f .env ]; then
              cat > .env <<EOF
            APP_SECRET=${{ secrets.APP_SECRET }}
            DATABASE_URL=sqlite:///%kernel.project_dir%/var/database/data.sqlite
            MESSENGER_TRANSPORT_DSN=doctrine://default?auto_setup=1
            JWT_SECRET_KEY=%kernel.project_dir%/config/jwt/private.pem
            JWT_PUBLIC_KEY=%kernel.project_dir%/config/jwt/public.pem
            JWT_PASSPHRASE=${{ secrets.JWT_PASSPHRASE }}
            EOF
            fi

            # Pull the latest image and deploy
            docker compose pull
            docker compose up -d

            docker compose exec -T deeta-app bash -c "php bin/console lexik:jwt:generate-keypair"
            docker compose exec -T deeta-app bash -c "php bin/console doctrine:migrations:migrate -n"
            docker compose exec -T deeta-app bash -c "npm install"
            docker compose exec -T deeta-app bash -c "php bin/console importmap:install -n"
            docker compose exec -T deeta-app bash -c "php bin/console cache:clear"
            docker compose exec -T deeta-app bash -c "php bin/console tailwind:build -n"

            # Clean up unused images
            docker image prune -f
